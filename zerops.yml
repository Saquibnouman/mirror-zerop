zerops:
  - setup: app
    build:
      base: alpine/nodejs@20
      buildCommands:
        - npm ci
      deployFiles:
        - ./
      cache:
        - node_modules

    run:
      base: alpine/nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: node target-server.js & node server.js
